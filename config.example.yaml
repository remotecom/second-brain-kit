# ============================================================================
# Second Brain Kit: your configuration.
#
# The Setup page writes this file for you. You can also copy it to
# `config.yaml` in your vault and fill it in by hand. `CLAUDE.md` reads these
# values wherever you see {{DOUBLE_BRACES}}, and the app reads every key.
#
# The MECHANICS (sync/ingest/query/lint, watermarks, rolling windows) are the
# same for everyone. Only the SCOPE and the TAXONOMY below are yours.
#
# Rules for this file:
# - The app never changes a value you set. An update only ADDS new keys, with
#   their defaults (`second-brain update` shows the diff first).
# - A key you leave out takes the default shown here.
# ============================================================================

config_version: 2

owner:
  name: "Your Name"
  email: "you@example.com"
  # Your Slack member ID (Slack profile -> More -> Copy member ID). Used by
  # `sync slack` to find your sent messages, and by the outbound-review gate.
  slack_user_id: "U000XXXXX"
  # Your self-DM channel ID, if you keep a working-notebook DM to yourself.
  slack_self_dm_id: ""
  # Your Notion user UUID. Leave blank: the Setup page finds it.
  notion_user_id: ""
  # Day boundaries, meeting times and the Morning run use this time zone.
  # Setup fills in your Mac's zone.
  timezone: "America/New_York"

# --------------------------------------------------------------------------
# CONNECTORS: the claude.ai connector each source uses. Tool names differ per
# account, so Setup probes them and writes the prefix here. Each value is the
# part before the double underscore, e.g. mcp__claude_ai_Slack for
# mcp__claude_ai_Slack__slack_read_thread.
# --------------------------------------------------------------------------
connectors:
  slack: "mcp__claude_ai_Slack"
  linear: "mcp__claude_ai_Linear"
  notion: "mcp__claude_ai_Notion"
  gcal: "mcp__claude_ai_Google_Calendar"
  gdrive: "mcp__claude_ai_Google_Drive"

# --------------------------------------------------------------------------
# SOURCE SCOPE: what the syncs pull in. This is the biggest per-function knob.
# A partnerships SA, an eng lead and a BizOps analyst scope these differently.
#
# window_days is the rolling re-fetch window: every sync re-reads at least
# this many days, so late thread replies and edits heal themselves.
#
# The exclude_* keys are the SENSITIVITY DENYLIST. Google accounts hold comp,
# HR, recruiting, medical and private-event content. Exclusions are applied at
# fetch time, so excluded content never reaches the vault.
# --------------------------------------------------------------------------
sources:
  slack:
    enabled: true
    window_days: 2
  gcal:
    enabled: true
    window_days: 4
    # EXPLICIT ALLOWLIST. Only these calendar IDs are synced. An account can
    # also read your personal calendar and colleagues' calendars; syncing
    # everything readable would pull those into the vault.
    calendars:
      - "you@example.com"
    include_private: false          # skip events with visibility: private
    include_declined: false         # skip events you declined
    # Descriptions over this length are cut with an explicit marker. A
    # DECLARED cap, never a per-event judgment by the sync.
    max_description_chars: 2000
  linear:
    enabled: true
    window_days: 4
    # ONE of these: an initiative (its whole sub-tree of initiatives and
    # projects) or a team key. Setup has a live, searchable picker.
    scope:
      initiative: ""                # Linear initiative ID
      team: ""                      # or a team key, e.g. "ENG"
  notion:
    enabled: true
    window_days: 4
    # Extra search words that find pages you created or edited. Notion search
    # needs a query; common words in your workspace work best.
    search_terms: ["the", "a"]
    # Databases you want watched (name + the signal they carry). Saved to
    # notion/.allowlist on the first run.
    watched: []
      # - name: "Team meeting notes"
      #   signal_type: "database"
  gdrive:
    enabled: true
    window_days: 4
    # Folders to sync in full. Single level: Drive's parentId does NOT recurse.
    watched_folders: []
    # Folder trees never synced, matched by ANY ancestor (by ID or by title).
    # The Meet trees hold recordings, chat logs and "Notes by Gemini" docs that
    # are often pure boilerplate. Excluding a FOLDER is auditable; judging each
    # doc would be the editorial discretion the Rules forbid.
    exclude_folders: []
    exclude_folder_titles:
      - "Meet Recordings"
      - "Google Meet"
    max_body_chars: 50000
  gmail:
    # SPECIFIED BUT NOT IMPLEMENTED. Enabling it needs THREE edits in one
    # change, one of which is wiki.promotion.person_external_min below. See the
    # Gmail op in .bot/ops.md (rendered from templates/vault/OPS.md).
    enabled: false
    window_days: 4
    max_threads_per_sync: 150
    max_body_chars: 12000
    exclude_labels: []              # label IDs, not display names
    exclude_categories: ["promotions", "social", "forums"]
    strip_quoted_replies: true      # else a 20-message thread stores itself 20x
    include_attachments: false

# The first sync of each source back-fills this many days once (3, 7, 14 or 30; 3 is a quick trial).
# After that the rolling window takes over.
bootstrap_days: 7

# --------------------------------------------------------------------------
# THE MORNING RUN: every enabled sync, then Resolve, Brief, Ingest (when due)
# and Verify. Fires once a day at morning_at in owner.timezone; if the Mac is
# asleep then, it runs on wake.
# --------------------------------------------------------------------------
schedule:
  enabled: true
  morning_at: "06:00"
  ingest_min_files: 60   # ingest when this many new raw files have piled up
  ingest_max_days: 3     # or when the last ingest is this many days old

# Bots run on your claude.ai plan and share its usage limits with you. This
# caps how much of a day's limit the bots may use: light, normal or heavy
# (about 25, 40 or 60 percent). The bots pause and tell you when they reach it.
usage_share: normal

# Claude Code sessions the app opens (Repair, Look into this, vault chat).
sessions:
  max_running: 4         # a 5th session puts the oldest idle one to sleep
  idle_sleep_min: 30     # a session with no input for this long goes to sleep
  keep_days: 30          # transcripts of finished sessions are kept this long

# Raw files the ingest skips, with the reason "excluded by config.yaml". The
# files stay on disk (raw is immutable); only wiki synthesis skips them.
ingest:
  exclude: []

# Linear depth. Initiatives listed here are DEEP: every issue, comment and
# document is synced and ingested. The rest of the scope is LINK-ONLY: one
# catalog row per project, never fetched in detail. Empty = everything deep.
linear:
  deep_initiatives: []

# --------------------------------------------------------------------------
# WIKI TAXONOMY: the entity types the synthesis layer organizes around.
# The defaults suit a partnerships / solutions-architecture function. SWAP
# THEM for what matters in yours. Examples:
#   eng:     services, runbooks, postmortems, rfcs, dependencies, oncall
#   biz-ops: accounts, processes, metrics, vendors, people, decisions
#   pm:      features, personas, competitors, experiments, decisions, people
# Every section becomes a folder under wiki/ and a group in wiki/index.md.
# --------------------------------------------------------------------------
wiki:
  sections:
    - partners      # external orgs you integrate/partner with
    - systems       # internal systems/components you own or depend on
    - integrators   # third-party connectivity/tooling vendors
    - problems      # recurring problem archetypes
    - people        # named individuals you engage
    - incidents     # postmortems
    - initiatives   # internal projects/efforts
    - principles    # your work-style canon (ships with templates)
    - concepts      # glossary of terms you re-explain
    - workflows     # how-to recipes reconstructed from tribal knowledge
    - customers     # end customers with substantive context

  # What goes in each section, one short line. Ingest reads these (they are
  # written into the kit block of the vault's CLAUDE.md). The Setup page's
  # Wiki shape step writes this list and wiki.sections together.
  section_notes:
    partners: external companies you integrate or partner with
    systems: your own company's systems and components
    integrators: third-party tools that connect the systems
    problems: problems that keep coming back
    people: named individuals you work with
    incidents: postmortems and outages
    initiatives: internal projects and efforts
    principles: your rules for how you work
    concepts: "terms you keep explaining: a glossary"
    workflows: how-to recipes rebuilt from what you did
    customers: end customers with real context

  # Promotion thresholds: when a raw mention earns its own wiki page.
  promotion:
    default_min_sources: 3      # partners/problems: 3+ raw sources
    # Raised from 1 to 2 for Gmail. At 1, every vendor, recruiter and one-off
    # contact who ever emailed you earns a wiki page and people/ floods.
    # Set back to 1 only if you do NOT enable gmail.
    person_external_min: 2
    concept_min_references: 3

# --------------------------------------------------------------------------
# TAG NAMESPACES: the controlled vocabulary for frontmatter tags. Keep it
# small and locked; lint flags anything outside these.
# --------------------------------------------------------------------------
tags:
  namespaces:
    - "domain/"     # functional area
    - "problem/"    # problem archetype
    - "tech/"       # technology
    - "partner/"
    - "customer/"
    - "system/"
    - "integrator/"

# Words too common in YOUR workspace to route an ingest entry to one page: the
# company name, internal system names. Generic stop words are built in.
route:
  stop_words: []

# --------------------------------------------------------------------------
# OUTBOUND REVIEW GATE: the "acts like me on outbound comms" layer.
# The kit ships a MECHANISM, not a personality. The core rule most people
# keep: never post directly, draft first.
# --------------------------------------------------------------------------
outbound_gate:
  draft_destination: "self_dm"   # self_dm | file | stdout
  never_direct_post: true
  voice_rules: "wiki/principles/outbound-voice.md"
