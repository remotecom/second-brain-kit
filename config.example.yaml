# ============================================================================
# Second Brain Kit — your configuration.
#
# Copy this file to `config.yaml` and fill it in. `CLAUDE.md` reads these
# values wherever you see {{DOUBLE_BRACES}}. This is the ONLY file you should
# need to edit to make the kit fit your function.
#
# The MECHANICS (sync/ingest/query/lint, watermarks, rolling windows, the
# multi-agent orchestration) are identical for everyone. Only the SCOPE and
# the TAXONOMY below are yours.
# ============================================================================

owner:
  name: "Your Name"
  # Your Slack member ID (Slack profile -> More -> Copy member ID). Used by
  # `sync slack` to find your sent messages, and by the outbound-review gate.
  slack_user_id: "U000XXXXX"
  # Your self-DM channel ID, if you keep a working-notebook DM to yourself.
  slack_self_dm_id: "D000XXXXX"
  # Your Notion user UUID. Leave blank on first run; `sync notion` resolves and
  # caches it to notion/.user-id.
  notion_user_id: ""

# --------------------------------------------------------------------------
# SOURCE SCOPE — what the sync ops pull in. This is the biggest per-function
# knob. A partnerships SA, an eng lead, and a BizOps analyst scope these very
# differently.
# --------------------------------------------------------------------------
sources:
  slack:
    enabled: true
    # Rolling re-fetch window in days (self-heals late thread replies).
    rolling_window_days: 4
  linear:
    enabled: true
    # Your Linear team key (e.g. "ENG", "GTM", "OPS"). The team whose work you
    # want synthesized. Sync scopes to this team's active + recently-closed
    # projects, plus anything assigned to you.
    team_key: "TEAM"
    rolling_window_days: 4
  notion:
    enabled: true
    rolling_window_days: 4
    # Databases you want watched (title + the signal they carry). Bootstrap on
    # first run: the kit searches by name, you confirm, it persists to
    # notion/.allowlist.
    watched_databases: []
      # - name: "Team meeting notes"
      #   signal_type: "database"
      # - name: "OKRs / planning"
      #   signal_type: "database"

  # ---- Google Workspace -----------------------------------------------------
  # These default to `enabled: false` (unlike the three above). Two reasons:
  #   1. Gmail and Calendar need `/mcp` auth before their tools exist at all.
  #   2. Many Workspace tenants block third-party Drive/Gmail OAuth scopes at
  #      the admin level, so a teammate may simply not be able to connect.
  # A disabled source is skipped cleanly instead of failing the whole sync.
  #
  # `bootstrap_horizon_days` only applies on a source's FIRST run (no
  # .last-sync yet). It back-fills history once, then the rolling window takes
  # over. Without it a new source on an existing vault would only ever see the
  # last few days and your history would be invisible forever.
  #
  # The `exclude_*` keys are the SENSITIVITY DENYLIST. These are personal
  # accounts: they hold comp, HR, recruiting, medical and private-event
  # content. Gitignore keeps that out of git; it does NOT keep it out of the
  # plaintext files every vault session reads, or out of synthesized wiki
  # pages. Exclusions are applied at fetch time so the content never lands.
  gdrive:
    enabled: false
    rolling_window_days: 4
    bootstrap_horizon_days: 365
    # Folders to sync in full (bootstrapped to gdrive/.allowlist on first run).
    # NOTE: single-level — the Drive API's parentId does NOT recurse into
    # subfolders. List subfolders explicitly if you need them.
    watched_folders: []
    # Excluded by folder title or ID. "Meet Recordings" is the default because
    # it holds video recordings, chat logs, and auto-generated "Notes by Gemini"
    # docs that are usually pure boilerplate ("A summary wasn't produced for this
    # meeting"). Excluding a FOLDER is auditable; judging each doc's emptiness
    # would be the editorial discretion the Rules forbid.
    exclude_folders:
      - "Meet Recordings"
    # Only types `read_file_content` can actually read. `text/*` is NOT
    # supported by the connector and would fail; images are supported but
    # produce useless raw, so they are deliberately absent.
    mime_allowlist:
      - "application/vnd.google-apps.document"
      - "application/vnd.google-apps.presentation"
      - "application/vnd.google-apps.spreadsheet"
      - "application/pdf"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    max_body_chars: 50000

  gmail:
    enabled: false
    rolling_window_days: 4
    bootstrap_horizon_days: 365
    # Hard ceiling per run. On truncation the watermark must NOT jump past the
    # threads that were dropped — see the Gmail op in CLAUDE.md.
    max_threads_per_sync: 150
    exclude_labels: []
    exclude_categories: ["promotions", "social", "forums"]
    strip_quoted_replies: true      # else a 20-message thread stores itself 20x
    include_attachments: false

  gcal:
    enabled: false
    rolling_window_days: 4
    bootstrap_horizon_days: 365
    # EXPLICIT ALLOWLIST. Only these calendar IDs are synced.
    # `list_calendars` on a real account also returns your PERSONAL calendar,
    # colleagues' calendars shared with you, and org PTO/holiday calendars.
    # Syncing everything readable would pull your personal life and a
    # coworker's schedule into the vault. List only what you want synthesized.
    calendars:
      - "you@yourcompany.com"       # your work calendar
    include_private: false          # skip events with visibility: private
    include_declined: false         # skip events you declined
    # Descriptions over this length are truncated with an explicit marker and
    # `truncated: true`. Corporate invites carry kilobytes of dial-in and legal
    # boilerplate. This is a DECLARED cap, not sync-agent judgment — the Rules
    # forbid editorial condensing, so the trim has to be a config rule you can
    # audit, not a decision the model makes per event.
    max_description_chars: 2000

# --------------------------------------------------------------------------
# WIKI TAXONOMY — the entity types the synthesis layer organizes around.
# The defaults below are tuned for a partnerships / solutions-architecture
# function. SWAP THEM for what matters in yours. Examples:
#   eng:     services, runbooks, postmortems, rfcs, dependencies, oncall
#   biz-ops: accounts, processes, metrics, vendors, people, decisions
#   pm:      features, personas, competitors, experiments, decisions, people
# Every section becomes a folder under wiki/ and a group in wiki/index.md.
# --------------------------------------------------------------------------
wiki:
  sections:
    - partners      # external orgs you integrate/partner with
    - systems       # internal systems/components you own or depend on
    - integrators   # third-party connectivity/tooling vendors
    - problems      # recurring problem archetypes
    - people        # named individuals you engage
    - incidents     # postmortems
    - initiatives   # internal projects/efforts
    - principles    # your work-style canon (ships with templates)
    - concepts      # glossary of terms you re-explain
    - workflows     # how-to recipes reconstructed from tribal knowledge
    - customers     # end customers with substantive context

  # Promotion thresholds — when a raw mention earns its own wiki page.
  promotion:
    default_min_sources: 3      # partners/problems: 3+ raw sources
    # Raised from 1 to 2 when Gmail landed. At 1, every vendor, recruiter and
    # one-off contact who ever emailed you earns a wiki page and people/ floods.
    # Set back to 1 only if you do NOT enable gmail.
    person_external_min: 2
    concept_min_references: 3

# --------------------------------------------------------------------------
# TAG NAMESPACES — the controlled vocabulary for frontmatter tags. Keep it
# small and locked; lint flags anything outside these.
# --------------------------------------------------------------------------
tags:
  namespaces:
    - "domain/"     # functional area
    - "problem/"    # problem archetype
    - "tech/"       # technology
    # add your own, e.g. "partner/", "system/", "customer/", "team/"

# --------------------------------------------------------------------------
# OUTBOUND REVIEW GATE — the "acts like me on outbound comms" layer.
# The kit ships a MECHANISM, not a personality. Declare your own rules here;
# wiki/principles/ ships a worked example (someone else's voice) you delete or
# overwrite. The core rule most people keep: never post directly — draft first.
# --------------------------------------------------------------------------
outbound_gate:
  # Where drafts go for your review before anything is sent anywhere.
  draft_destination: "self_dm"   # self_dm | file | stdout
  never_direct_post: true
  # Path to your voice/style rules (a principles page you author).
  voice_rules: "wiki/principles/outbound-voice.md"
